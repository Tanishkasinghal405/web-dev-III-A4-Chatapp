<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in · ChatApp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <div class="bg-orbs"><span></span><span></span><span></span></div>

  <main class="auth-page">
    <section class="auth-card glass">
      <div class="brand">
        <div class="brand-logo"><i data-icon="chat"></i></div>
        <div class="brand-name">Chat<span>App</span></div>
      </div>

      <h1>Welcome back</h1>
      <p class="sub">Log in to continue your conversations.</p>

      <form id="loginForm" class="auth-form" novalidate>
        <div id="formAlert" class="form-alert" role="alert"></div>

        <div class="field" id="f-identifier">
          <label for="identifier">Email or username</label>
          <div class="input-wrap">
            <span class="lead"><i data-icon="user"></i></span>
            <input id="identifier" type="text" autocomplete="username" placeholder="you@example.com or username" required />
          </div>
          <div class="field-error"></div>
        </div>

        <div class="field" id="f-password">
          <label for="password">Password</label>
          <div class="input-wrap has-toggle">
            <span class="lead"><i data-icon="lock"></i></span>
            <input id="password" type="password" autocomplete="current-password" placeholder="Your password" required />
            <button type="button" class="toggle-pass" data-target="password"></button>
          </div>
          <div class="field-error"></div>
        </div>

        <label class="check"><input id="remember" type="checkbox" /> Keep me logged in for 30 days</label>

        <button id="submitBtn" class="btn btn-primary" type="submit">Log in</button>
      </form>

      <p class="switch">New to ChatApp? <a href="/register.html">Create an account</a></p>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
